name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package module
        run: zip -r module.zip module.json lang modules styles template README.md LICENSE

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "module.json,module.zip"
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
